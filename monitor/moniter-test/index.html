<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>CCTV Monitor | อบจ.ชลบุรี</title>
  <style>
    :root {
      --bg: #07101f;
      --panel: rgba(15, 28, 48, 0.92);
      --panel-2: #101f35;
      --line: rgba(148, 163, 184, 0.22);
      --text: #eaf2ff;
      --muted: #93a4bc;
      --primary: #2e8bff;
      --primary-hover: #57a4ff;
      --success: #3ddc97;
      --warning: #ffbf47;
      --danger: #ff647c;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(46, 139, 255, 0.18), transparent 32%),
        linear-gradient(145deg, #050b15, var(--bg));
      color: var(--text);
    }

    button, select, a { font: inherit; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: 12px;
    }

    .toolbar {
      min-height: 76px;
      display: grid;
      grid-template-columns: minmax(250px, 1fr) minmax(300px, 560px) auto;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, #1769ff, #28b9ff);
      box-shadow: 0 8px 24px rgba(46, 139, 255, 0.35);
      font-size: 23px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .site-control {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    .site-control label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    select {
      width: 100%;
      min-height: 44px;
      padding: 0 42px 0 14px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46, 139, 255, 0.18);
    }

    option { background: #102039; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: #12233b;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: #18304f;
      border-color: rgba(87, 164, 255, 0.55);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn.primary:hover { background: var(--primary-hover); }

    .viewer {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #02060d;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .status-bar {
      position: absolute;
      z-index: 5;
      left: 12px;
      bottom: 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: calc(100% - 24px);
      padding: 8px 11px;
      color: #dce9fb;
      background: rgba(5, 12, 23, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      pointer-events: none;
      font-size: 12px;
    }

    .dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(61, 220, 151, 0.14);
    }

    .dot.loading {
      background: var(--warning);
      box-shadow: 0 0 0 4px rgba(255, 191, 71, 0.14);
      animation: pulse 1s infinite alternate;
    }

    .dot.error {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255, 100, 124, 0.14);
    }

    @keyframes pulse { to { opacity: .45; } }

    .clock {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    @media (max-width: 950px) {
      html, body { overflow: auto; }
      .app { min-height: 100vh; height: auto; grid-template-rows: auto minmax(600px, 1fr); }
      .toolbar { grid-template-columns: 1fr; }
      .actions { justify-content: stretch; flex-wrap: wrap; }
      .actions .btn { flex: 1 1 140px; }
    }

    @media (max-width: 560px) {
      .app { padding: 8px; gap: 8px; grid-template-rows: auto minmax(520px, 1fr); }
      .toolbar { padding: 12px; }
      .site-control { grid-template-columns: 1fr; gap: 6px; }
      .brand p { display: none; }
      .btn .label { display: none; }
      .btn { flex: 1 1 56px !important; }
      .status-bar { border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">◉</div>
        <div>
          <h1>CCTV Monitor — อบจ.ชลบุรี</h1>
          <p>ศูนย์รวมการเข้าถึงระบบเฝ้าระวัง</p>
        </div>
      </div>

      <div class="site-control">
        <label for="siteSelect">เลือกจุด Monitor</label>
        <select id="siteSelect" aria-label="เลือกจุด Monitor">
          <option value="central">CCTV อบจ.ชลบุรี — รวมศูนย์</option>
          <option value="banglamung">CCTV อบจ. — สภ.บางละมุง</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn" id="reloadBtn" type="button" title="โหลดหน้าใหม่">
          <span aria-hidden="true">↻</span><span class="label">Refresh</span>
        </button>
        <a class="btn primary" id="openBtn" href="#" target="_blank" rel="noopener noreferrer" title="เปิดในแท็บใหม่">
          <span aria-hidden="true">↗</span><span class="label">เปิดเต็มหน้า</span>
        </a>
        <button class="btn" id="fullscreenBtn" type="button" title="Fullscreen">
          <span aria-hidden="true">⛶</span><span class="label">Fullscreen</span>
        </button>
      </div>
    </header>

    <section class="viewer" id="viewer">
      <iframe
        id="monitorFrame"
        title="CCTV Monitor"
        width="1024"
        height="768"
        frameborder="1"
        allow="fullscreen"
      ></iframe>

      <div class="status-bar" aria-live="polite">
        <span class="dot loading" id="statusDot"></span>
        <span id="statusText">กำลังเตรียม Monitor...</span>
        <span aria-hidden="true">•</span>
        <span class="clock" id="clock"></span>
      </div>
    </section>
  </main>

  <script>
    'use strict';

    const SITES = {
      central: {
        name: 'CCTV อบจ.ชลบุรี — รวมศูนย์',
        url: 'http://rfcctv.fortiddns.com:8443/public/mapshow.htm?id=2506&mapid=26815356-D3C7-4522-91C0-80DB58E8FF69'
      },
      banglamung: {
        name: 'CCTV อบจ. — สภ.บางละมุง',
        url: 'http://rfcctv.fortiddns.com:8443/public/mapshow.htm?id=2447&mapid=D85564DB-3F1D-4D10-8E21-99B0CA9B2D98'
      }
    };

    const siteSelect = document.getElementById('siteSelect');
    const monitorFrame = document.getElementById('monitorFrame');
    const openBtn = document.getElementById('openBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const viewer = document.getElementById('viewer');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const clock = document.getElementById('clock');

    let currentKey = 'central';
    let loadTimer = null;

    function setStatus(type, message) {
      statusDot.className = 'dot' + (type ? ` ${type}` : '');
      statusText.textContent = message;
    }

    function updateQueryString(key) {
      const url = new URL(window.location.href);
      url.searchParams.set('site', key);
      history.replaceState(null, '', url);
    }

    function loadSite(key) {
      if (!SITES[key]) key = 'central';

      currentKey = key;
      const site = SITES[key];
      siteSelect.value = key;
      openBtn.href = site.url;
      document.title = `${site.name} | CCTV Monitor`;
      localStorage.setItem('cctv-monitor-site', key);
      updateQueryString(key);

      clearTimeout(loadTimer);
      setStatus('loading', `กำลังโหลด: ${site.name}`);

      // เปลี่ยน URL ของ iframe โดยตรงตามรายการใน Dropdown
      monitorFrame.src = site.url;

      loadTimer = setTimeout(() => {
        setStatus('error', 'โหลดนานผิดปกติ — ตรวจสอบเครือข่ายหรือกดเปิดเต็มหน้า');
      }, 15000);
    }

    monitorFrame.addEventListener('load', () => {
      clearTimeout(loadTimer);
      setStatus('', `กำลังแสดง: ${SITES[currentKey].name}`);
    });

    siteSelect.addEventListener('change', () => loadSite(siteSelect.value));

    reloadBtn.addEventListener('click', () => {
      // ใส่ URL เดิมกลับเข้า iframe เพื่อบังคับโหลดใหม่
      monitorFrame.src = SITES[currentKey].url;
      setStatus('loading', `กำลังโหลดใหม่: ${SITES[currentKey].name}`);
    });

    fullscreenBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await viewer.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.error('Fullscreen failed:', error);
      }
    });

    document.addEventListener('fullscreenchange', () => {
      fullscreenBtn.querySelector('.label').textContent = document.fullscreenElement ? 'ออกจาก Fullscreen' : 'Fullscreen';
    });

    function updateClock() {
      clock.textContent = new Intl.DateTimeFormat('th-TH', {
        dateStyle: 'medium',
        timeStyle: 'medium',
        hour12: false,
        timeZone: 'Asia/Bangkok'
      }).format(new Date());
    }

    const querySite = new URLSearchParams(window.location.search).get('site');
    const savedSite = localStorage.getItem('cctv-monitor-site');
    const initialSite = SITES[querySite] ? querySite : (SITES[savedSite] ? savedSite : 'central');

    updateClock();
    setInterval(updateClock, 1000);
    loadSite(initialSite);
  </script>
</body>
</html>
