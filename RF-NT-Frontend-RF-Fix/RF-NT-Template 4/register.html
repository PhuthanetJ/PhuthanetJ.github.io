<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/custom-input.css">
    <link rel="stylesheet" href="css/custom-dropdown.css">
</head>

<body>
    <div style="height: 100%;">
        <div class="wrapper container-fluid p-0" style="background-image: url(./img/background.png);">
            <!-- Top Bar -->
            <div class="top-bar d-flex flex-row justify-content-between align-items-start p-2">
                <!-- Logo -->
                <div class="d-flex flex-column col-6 col-md-3">
                    <img src="img/NT1.png" alt="Icon" class="icon-nt">
                    <!-- <img src="img/NT2.png" alt="Icon" class="icon-nt"> -->
                </div>
                <!-- Language Dropdown Menu -->
                <div class="custom-dropdown language-dropdown align-self-start col-6 col-md-1">
                    <button class="btn btn-light custom-dropdown-toggle" type="button" id="languageDropdown">
                        <img class="mr-2" src="img/flag-th.png" alt="Thai Flag" width="20" height="15"> ไทย
                        <span class="dropdown-arrow">&#9662;</span>
                    </button>
                    <div class="custom-dropdown-menu" id="languageDropdownMenu">
                        <a class="dropdown-item" href="#" data-value="ไทย" data-flag="img/flag-th.png"><img
                                src="img/flag-th.png" alt="Thai Flag" width="20" height="15"> ไทย</a>
                        <a class="dropdown-item" href="#" data-value="English" data-flag="img/flag-us.png"><img
                                src="img/flag-us.png" alt="US Flag" width="20" height="15"> English</a>
                        <a class="dropdown-item" href="#" data-value="日本語" data-flag="img/flag-jp.png"><img
                                src="img/flag-jp.png" alt="Japan Flag" width="20" height="15"> 日本語</a>
                        <a class="dropdown-item" href="#" data-value="한국어" data-flag="img/flag-kr.png"><img
                                src="img/flag-kr.png" alt="Korea Flag" width="20" height="15"> 한국어</a>
                        <a class="dropdown-item" href="#" data-value="中国的" data-flag="img/flag-cn.png"><img
                                src="img/flag-cn.png" alt="China Flag" width="20" height="15"> 中国的</a>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="row no-gutters main-container">
                <!-- Left Banner -->
                <div class="col-md-7 d-md-block" id="left-banner">
                    <!-- <img src="img/backgroud.jpg" alt="Banner Image" class="img-fluid w-100 h-100" style="object-fit: cover;"> -->
                </div>
                <div class="col-md-5 d-flex flex-column" id="main-content">
                    <!-- Promo1 Banner -->
                    <div class="my-3 text-center">
                        <img src="img/promo.png" alt="Promotion Banner" class="img-fluid w-100 promo">
                    </div>

                    <!-- Content Start -->
                    <div class="main-content">
                        <div class="content-body bg-color">
                            <form onsubmit="return register(event)">
                                <div class="form-row">
                                    <!-- Content Header -->
                                    <div class="form-group col-12">
                                        <h1 class="a mb-4 text-center justify-content-center d-flex flex-column align-items-center font-weight-bold">ลงทะเบียน</h1>
                                    </div>
                                    <div class="form-group col-12">
                                        <label for="full-name">ชื่อ - นามสกุล</label>
                                        <input type="text" id="full-name" class="form-control custom-input"
                                            placeholder="ชื่อ - นามสกุล">
                                    </div>
                                    <div class="form-group col-12">
                                        <label for="id-number">เลขบัตรประจำตัวประชาชน</label>
                                        <input type="number" id="id-number" class="form-control custom-input"
                                            placeholder="เลขบัตรประจำตัวประชาชน">
                                    </div>
                                    <div class="form-group col-12">
                                        <label for="birth-date">วัน/เดือน/ปี เกิด</label>
                                        <div class="calendar-input">
                                            <input type="text" id="birth-date" class="form-control custom-input date-type"
                                                placeholder="วัน/เดือน/ปี เกิด" onfocus="(this.type='date')">
                                            <span class="calendar-icon"></span>
                                        </div>
                                    </div>
                                    <div class="form-group col-12">
                                        <label for="email">อีเมล์</label>
                                        <input type="email" id="email" class="form-control custom-input"
                                            placeholder="อีเมล์">
                                    </div>
                                    <div class="form-group col-12">
                                        <label for="phone">เบอร์มือถือ</label>
                                        <input type="number" id="phone" class="form-control custom-input"
                                            placeholder="เบอร์มือถือ">
                                    </div>
                                </div>
                                <div class="form-row justify-content-center mt-3">
                                    <div class="col-12 center-elements">
                                        <button type="submit" class="btn btn-primary btn-color-primary col-12" onclick="window.location.href='waitVerify.html'">
                                            ลงทะเบียน
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                    <!-- Content End -->

                    <!-- Promo2 Banner -->
                    <div class="promo-mb mobile my-3 text-center">
                        <img src="img/promo2.png" alt="Promotion Banner" class="img-fluid w-100 promo" style="max-width: 450px;">
                    </div>

                    <!-- Bottom Navigation -->
                    <div class="mt-auto bottom-nav bg-color">
                        <a href="error.html" class="nav-item">
                            <img src="img/check-usage.png" alt="ตรวจสอบยอดใช้งาน">
                            <p>ตรวจสอบยอดใช้งาน</p>
                        </a>
                        <a href="howto.html" class="nav-item">
                            <img src="img/usage-guide.png" alt="วิธีการใช้งาน">
                            <p>วิธีการใช้งาน</p>
                        </a>
                        <a href="troubleshoot.html" class="nav-item">
                            <img src="img/problem-solving.png" alt="การแก้ไขปัญหา">
                            <p>การแก้ไขปัญหา</p>
                        </a>
                        <a href="error.html" class="nav-item">
                            <img src="img/service-area.png" alt="พื้นที่ให้บริการ">
                            <p>พื้นที่ให้บริการ</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const maxLengths = {
                'id-number': 13,
                'passport-number': 9,
                'phone': 10
            };

            for (const [id, maxLength] of Object.entries(maxLengths)) {
                document.getElementById(id).addEventListener('input', function () {
                    if (this.value.length > maxLength) {
                        this.value = this.value.slice(0, maxLength);
                    }
                });
            }
        });

        function register(event) {
            event.preventDefault();

            // Clear previous errors
            const inputs = document.querySelectorAll('.custom-input');
            inputs.forEach(input => {
                input.classList.remove('error');
            });

            const dropdowns = document.querySelectorAll('.custom-dropdown-toggle');
            dropdowns.forEach(dropdown => {
                dropdown.classList.remove('error');
            });

            let isValid = true;

            // Validate ID number
            const idNumber = document.getElementById('id-number');
            if (idNumber.value.length !== 13) {
                idNumber.classList.add('error');
                isValid = false;
            }

            // Validate Email
            const email = document.getElementById('email');
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email.value)) {
                email.classList.add('error');
                isValid = false;
            }

            // Validate Phone number
            const phone = document.getElementById('phone');
            if (phone.value.length !== 10) {
                phone.classList.add('error');
                isValid = false;
            }

            // Validate Dropdowns
            const titleDropdown = document.getElementById('titleDropdown');
            const genderDropdown = document.getElementById('genderDropdown');
            const provinceDropdown = document.getElementById('provinceDropdown');

            if (titleDropdown.innerText.trim().startsWith('กรุณาเลือก')) {
                titleDropdown.classList.add('error');
                isValid = false;
            }
            if (genderDropdown.innerText.trim().startsWith('กรุณาเลือก')) {
                genderDropdown.classList.add('error');
                isValid = false;
            }
            if (provinceDropdown.innerText.trim().startsWith('กรุณาเลือก')) {
                provinceDropdown.classList.add('error');
                isValid = false;
            }

            const requiredFields = document.querySelectorAll('.custom-input:not(#passport-number)');
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.classList.add('error');
                    isValid = false;
                }
            });

            if (isValid) {
                window.location.href = "register-success.html";
            }
        }
    </script>
</body>

</html>
