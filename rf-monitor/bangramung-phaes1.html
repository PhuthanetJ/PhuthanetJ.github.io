<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สถานะ Network Map</title>
    <style>
  .iframe-container {
    position: relative;
    width: 100%;
    max-width: 1024px;   /* จำกัดความกว้างสูงสุด */
    margin: 0 auto;      /* จัดกลางแนวนอน */
    padding-bottom: 75%; /* อัตราส่วน 4:3 ของ 1024x768 */
    height: 0;
    overflow: hidden;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
  }

  .iframe-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ปรับปุ่มให้ responsive ด้วย */
  a.button {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background: #007bff;
    color: white;
    text-decoration: none;
    border-radius: 4px;
  }

  a.button:hover {
    background: #0056b3;
  }

  .note {
    font-size: 12px;
    color: gray;
    margin-top: 20px;
  }
</style>
</head>

<body>
    <h2>📊 สถานะ Network Map วันนี้</h2>
    <iframe width=1024 height=768 frameborder="1"
        src="https://rfcctv.fortiddns.com:8443/public/mapshow.htm?id=2447&mapid=D85564DB-3F1D-4D10-8E21-99B0CA9B2D98">
    </iframe>

       alt="Network Map"> -->

    <p>
        <a href="https://rfcctv.fortiddns.com:8443/public/mapshow.htm?id=2447&mapid=D85564DB-3F1D-4D10-8E21-99B0CA9B2D98"
            target="_blank">
            🔗 คลิกเพื่อดูแบบ Dashboard
        </a>

</body>

</html>
