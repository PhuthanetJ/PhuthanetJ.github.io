<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>NT Network Operations Dashboard</title>

  <style>
    :root {
      --bg: #07101e;
      --surface: rgba(15, 27, 46, 0.88);
      --surface-2: rgba(20, 36, 59, 0.82);
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --brand: #35c2ff;
      --brand-2: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --header-height: 84px;
      --toolbar-height: 54px;
      --radius: 18px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(37, 99, 235, 0.23), transparent 32%),
        radial-gradient(circle at 95% 10%, rgba(14, 165, 233, 0.16), transparent 28%),
        var(--bg);
    }

    button,
    a {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: var(--header-height) minmax(0, 1fr);
      width: 100%;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 20px;
      background: rgba(7, 16, 30, 0.82);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 14px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      color: #03111d;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(145deg, #e0f7ff, #38bdf8 55%, #2563eb);
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.24);
    }

    .heading {
      min-width: 0;
    }

    .heading h1 {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(1rem, 2vw, 1.22rem);
      font-weight: 750;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .heading p {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.8rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      70% {
        box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }

    .header-info {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .info-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(15, 27, 46, 0.65);
    }

    .info-chip svg {
      width: 18px;
      height: 18px;
      color: var(--brand);
    }

    .info-chip .label {
      display: block;
      color: var(--muted);
      font-size: 0.69rem;
      line-height: 1.1;
    }

    .info-chip .value {
      display: block;
      margin-top: 2px;
      color: var(--text);
      font-size: 0.79rem;
      font-weight: 650;
      line-height: 1.2;
      white-space: nowrap;
    }

    .dashboard {
      min-height: 0;
      padding: 14px;
    }

    .map-card {
      display: grid;
      grid-template-rows: var(--toolbar-height) minmax(0, 1fr);
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 10px 8px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(19, 33, 54, 0.92), rgba(10, 22, 39, 0.92));
    }

    .map-meta {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .map-meta strong {
      overflow: hidden;
      font-size: 0.88rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      padding: 6px 10px;
      color: #bbf7d0;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid rgba(34, 197, 94, 0.22);
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.1);
    }

    .status-badge.loading {
      color: #bae6fd;
      border-color: rgba(56, 189, 248, 0.24);
      background: rgba(56, 189, 248, 0.1);
    }

    .status-badge.error {
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.26);
      background: rgba(239, 68, 68, 0.11);
    }

    .status-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: currentColor;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 38px;
      height: 38px;
      padding: 0 11px;
      color: #dbeafe;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(15, 27, 46, 0.82);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      text-decoration: none;
    }

    .action-btn:hover {
      border-color: rgba(56, 189, 248, 0.52);
      background: rgba(30, 64, 175, 0.25);
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn svg {
      width: 17px;
      height: 17px;
    }

    .action-btn span {
      font-size: 0.76rem;
      font-weight: 650;
    }

    .map-stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px),
        #091421;
      background-size: 28px 28px;
    }

    #prtgMap {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .loading-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(7, 16, 30, 0.9);
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 5;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-box {
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border: 3px solid rgba(148, 163, 184, 0.22);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-box strong {
      display: block;
      font-size: 0.95rem;
    }

    .loading-box small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 100;
      max-width: min(360px, calc(100vw - 36px));
      padding: 12px 15px;
      color: #e2e8f0;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(15, 27, 46, 0.96);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 860px) {
      :root {
        --header-height: 72px;
      }

      .topbar {
        padding: 9px 12px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 13px;
      }

      .info-chip.clock-chip {
        display: none;
      }

      .dashboard {
        padding: 8px;
      }

      .map-card {
        border-radius: 14px;
      }

      .action-btn span {
        display: none;
      }

      .action-btn {
        width: 38px;
        padding: 0;
      }
    }

    @media (max-width: 560px) {
      :root {
        --header-height: 66px;
        --toolbar-height: 50px;
      }

      .brand-group {
        gap: 10px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        font-size: 0.92rem;
      }

      .heading h1 {
        max-width: 56vw;
        font-size: 0.95rem;
      }

      .heading p {
        max-width: 58vw;
        font-size: 0.7rem;
      }

      .info-chip.status-chip {
        min-height: 40px;
        padding: 7px 9px;
      }

      .status-chip .label,
      .status-chip svg {
        display: none;
      }

      .status-chip .value {
        margin: 0;
        font-size: 0.7rem;
      }

      .toolbar {
        padding-left: 10px;
      }

      .map-meta strong {
        display: none;
      }

      .status-badge {
        padding: 5px 8px;
        font-size: 0.68rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-group">
        <div class="brand-mark" aria-label="NT">NT</div>
        <div class="heading">
          <h1>Network Operations Dashboard</h1>
          <p>
            <span class="pulse-dot" aria-hidden="true"></span>
            <span>PRTG Network Map · สถานะเครือข่ายวันนี้</span>
          </p>
        </div>
      </div>

      <div class="header-info">
        <div class="info-chip status-chip" title="สถานะการเชื่อมต่อหน้า Map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 12.55a11 11 0 0 1 14.08 0" />
            <path d="M8.5 16a6 6 0 0 1 7 0" />
            <path d="M12 20h.01" />
          </svg>
          <div>
            <span class="label">Map Connection</span>
            <span class="value" id="connectionText">กำลังเชื่อมต่อ</span>
          </div>
        </div>

        <div class="info-chip clock-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
          <div>
            <span class="label">เวลาปัจจุบัน</span>
            <span class="value" id="datetime">กำลังโหลด...</span>
          </div>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <section class="map-card" id="mapCard" aria-label="PRTG Network Map">
        <div class="toolbar">
          <div class="map-meta">
            <span class="status-badge loading" id="mapStatus">
              <span class="dot"></span>
              <span id="mapStatusText">Loading PRTG Map</span>
            </span>
            <strong>ภาพรวมอุปกรณ์และโครงข่าย</strong>
          </div>

          <div class="actions">
            <button class="action-btn" id="refreshBtn" type="button" title="รีเฟรช Map">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 6v5h-5" />
                <path d="M4 18v-5h5" />
                <path d="M6.1 9a7 7 0 0 1 11.4-2.4L20 9" />
                <path d="M17.9 15a7 7 0 0 1-11.4 2.4L4 15" />
              </svg>
              <span>รีเฟรช</span>
            </button>

            <a class="action-btn" id="openMapBtn" href="#" target="_blank" rel="noopener noreferrer" title="เปิด Map ในแท็บใหม่">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M14 4h6v6" />
                <path d="M10 14 20 4" />
                <path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5" />
              </svg>
              <span>เปิด Map</span>
            </a>

            <button class="action-btn" id="fullscreenBtn" type="button" title="แสดงเต็มหน้าจอ">
              <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M8 3H3v5" />
                <path d="M16 3h5v5" />
                <path d="M8 21H3v-5" />
                <path d="M16 21h5v-5" />
              </svg>
              <span>เต็มจอ</span>
            </button>
          </div>
        </div>

        <div class="map-stage">
          <iframe
            id="prtgMap"
            title="PRTG Public Network Map"
            allowfullscreen
            loading="eager"
            referrerpolicy="no-referrer-when-downgrade"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms">
          </iframe>

          <div class="loading-screen" id="loadingScreen">
            <div class="loading-box">
              <div class="spinner" aria-hidden="true"></div>
              <strong>กำลังโหลดข้อมูลจาก PRTG</strong>
              <small>โปรดตรวจสอบ VPN, Firewall และ Public Map URL หากใช้เวลานานผิดปกติ</small>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // URL ของ PRTG Public Map
    const PRTG_MAP_URL = "https://rfcctv.fortiddns.com:8443/public/mapshow.htm?id=2447&mapid=D85564DB-3F1D-4D10-8E21-99B0CA9B2D98";

    // รีเฟรช Map อัตโนมัติทุก 5 นาที
    const AUTO_REFRESH_MS = 5 * 60 * 1000;

    const prtgMap = document.getElementById("prtgMap");
    const loadingScreen = document.getElementById("loadingScreen");
    const mapStatus = document.getElementById("mapStatus");
    const mapStatusText = document.getElementById("mapStatusText");
    const connectionText = document.getElementById("connectionText");
    const refreshBtn = document.getElementById("refreshBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const mapCard = document.getElementById("mapCard");
    const openMapBtn = document.getElementById("openMapBtn");
    const toast = document.getElementById("toast");

    let loadingTimeout;
    let toastTimeout;

    function updateDateTime() {
      const now = new Date();
      const date = now.toLocaleDateString("th-TH-u-ca-buddhist", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      const time = now.toLocaleTimeString("th-TH", {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      document.getElementById("datetime").textContent = `${date} · ${time}`;
    }

    function showToast(message) {
      clearTimeout(toastTimeout);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimeout = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function setMapState(state, text) {
      mapStatus.className = "status-badge";
      if (state) mapStatus.classList.add(state);
      mapStatusText.textContent = text;

      if (state === "loading") {
        connectionText.textContent = "กำลังเชื่อมต่อ";
      } else if (state === "error") {
        connectionText.textContent = "ตรวจสอบการเชื่อมต่อ";
      } else {
        connectionText.textContent = "เชื่อมต่อแล้ว";
      }
    }

    function buildMapUrl() {
      const url = new URL(PRTG_MAP_URL);
      // ป้องกัน browser cache เมื่อกดรีเฟรชหรือรีเฟรชอัตโนมัติ
      url.searchParams.set("_dashboard_ts", Date.now().toString());
      return url.toString();
    }

    function loadMap(showMessage = false) {
      clearTimeout(loadingTimeout);
      loadingScreen.classList.remove("hidden");
      setMapState("loading", "Loading PRTG Map");
      prtgMap.src = buildMapUrl();

      if (showMessage) {
        showToast("กำลังรีเฟรช Network Map");
      }

      // iframe แบบ Cross-Origin ตรวจ HTTP status โดยตรงไม่ได้
      // จึงแจ้งเตือนเมื่อใช้เวลาโหลดเกิน 20 วินาที
      loadingTimeout = setTimeout(() => {
        setMapState("error", "Loading takes too long");
        connectionText.textContent = "โหลดช้ากว่าปกติ";
        loadingScreen.classList.add("hidden");
        showToast("Map โหลดช้า กรุณาตรวจสอบ PRTG, VPN หรือ Firewall");
      }, 20000);
    }

    prtgMap.addEventListener("load", () => {
      clearTimeout(loadingTimeout);
      loadingScreen.classList.add("hidden");
      setMapState("", "PRTG Map Online");
    });

    refreshBtn.addEventListener("click", () => loadMap(true));

    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await mapCard.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        showToast("Browser ไม่อนุญาตให้เปิดโหมดเต็มหน้าจอ");
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.title = document.fullscreenElement
        ? "ออกจากโหมดเต็มหน้าจอ"
        : "แสดงเต็มหน้าจอ";
    });

    window.addEventListener("online", () => {
      showToast("Internet กลับมาเชื่อมต่อแล้ว");
      loadMap();
    });

    window.addEventListener("offline", () => {
      clearTimeout(loadingTimeout);
      loadingScreen.classList.add("hidden");
      setMapState("error", "Browser Offline");
      connectionText.textContent = "ไม่มี Internet";
      showToast("อุปกรณ์นี้ไม่มีการเชื่อมต่อ Internet");
    });

    openMapBtn.href = PRTG_MAP_URL;

    updateDateTime();
    setInterval(updateDateTime, 1000);
    setInterval(() => loadMap(), AUTO_REFRESH_MS);
    loadMap();
  </script>
</body>
</html>
