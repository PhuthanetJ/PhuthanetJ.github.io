<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | Wi-Fi Tools</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
    <script defer src="../js/offline-data.js"></script>
    <script defer src="../js/domain.js"></script>
    <script defer src="../js/banner-model.js"></script>
    <script defer src="../js/portal-bindings.js"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="../js/pages/login.js"></script>
    <link rel="stylesheet" href="../css/mobile.css">
    <script defer src="../js/mobile.js"></script>
</head>

<body>
    <div id="nt-portal" data-page="login">
        <main class="wt-login">
            <h1>Wi-Fi Tools</h1>
            <p>Portal / Sites / Reports</p>
            <div class="nt-panel">
                <h3>เข้าสู่ระบบ</h3>
                <form id="login-form"><label class="nt-field">Username<input id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required
                            value=""></label><label class="nt-field">Password<input id="login-password" type="password" autocomplete="current-password" required
                            value=""></label><button class="nt-button primary" type="submit">เข้าสู่ระบบ</button>
                    <p id="login-error" role="alert"></p>
                </form>
                <details open>
                    <summary>บัญชีทดสอบ</summary>
                    <p>รหัสผ่านทุกบัญชี: <strong>Demo1234!</strong></p>
                    <div id="login-accounts"></div>
                </details>
            </div>
            <p class="nt-help">ต้นแบบออฟไลน์ · Login และสิทธิ์จำลองบน Browser</p>
        </main>
    </div>
</body>

</html>
